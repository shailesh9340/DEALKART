<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DEALKART</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:Arial;background:#cac7a5}

/* HEADER */
header{
position:fixed;top:0;width:100%;height:65px;z-index:100;
background:#2209c2;padding:0 15px;
display:flex;align-items:center;justify-content:space-between;
}
header img{height:45px;border-radius:50%;border: 3px solid #f7f3f3}
.brand-name{color:#f4d407;font-size:20px;font-weight:900;letter-spacing: 2px;/* --- NEW TEXT SHADOW --- */ text-shadow: 2px 2px 4px rgba(0,0,0,0.5);}
#userTop{color:#edf57f;font-weight:bold;cursor:pointer;margin-right:25px}

/* MAIN */
.main{padding-top:70px;padding-bottom:120px}

/* SEARCH */
.search-wrapper{padding:10px}
.search-input {
    width: 90%; padding: 12px; border: none; border-radius: 30px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2); outline: none;
}

/* VALENTINE FLIPKART STYLE SECTION */
.v-container {
    background: #fff; margin: 10px; border-radius: 10px; overflow: hidden;
    border: 2px solid #eb1115;
}
.v-header {
    background: #ff416c; color: #fff; padding: 8px; text-align: center;
    font-weight: bold; font-size: 14px;
}
.v-scroll {
    display: flex; overflow-x: auto; padding: 10px; gap: 15px;
}
.v-item {
    min-width: 100px; text-align: center;
}
.v-item img {
    width: 80px; height: 80px; border-radius: 10px; object-fit: cover;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}
.v-item p { margin: 5px 0; font-size: 12px; font-weight: bold; color: #d32f2f; }

/* CATEGORY */
.cat-scroll{display:flex;overflow-x:auto;background:#d81583;padding:10px;margin:0 10px;border-radius:10px}
.cat-item{min-width:85px;text-align:center;margin-right:10px; font-weight: bold; cursor: pointer;
/* --- NEW BORDER STYLE --- */
border: 1px solid #000; /* Black border */
padding: 8px 10px;border-radius:5px;background: #fff;display:inline-block;
}

.sub-scroll{display:flex;overflow-x:auto;padding:10px;margin:0 10px}
.sub-btn{padding:6px 15px;background:#eee;border-radius:20px;margin-right:8px; cursor: pointer;}

/* PRODUCTS */
#grid_panel{ display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:10px; }
.prod-card{ background:#fff; border-radius:10px; overflow:hidden; position:relative; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
.prod-img-box{ height:180px; position:relative; }

/* SLIDER */
.slider{display:flex;overflow-x:auto;scroll-snap-type:x mandatory; scrollbar-width: none;}
.slider::-webkit-scrollbar {display: none;}
.slider img{min-width:100%;height:180px;object-fit:cover;scroll-snap-align:start;cursor:pointer}

/* ARROWS - EXACTLY LIKE YOUR ORIGINAL */
.arrow{
position:absolute;top:50%;
transform:translateY(-50%);
background:rgba(0,0,0,0.5);
color:#fff;width:30px;height:30px;border-radius:50%;
display:flex;align-items:center;justify-content:center;
font-size:18px;cursor:pointer;z-index:5;user-select:none;
}
.arrow.left{left:5px}
.arrow.right{right:5px}

.info-box{padding:15px}
.price{color:green;font-weight:bold}
.cut{text-decoration:line-through;color:#f40e0e;font-size:12px}
.btn-row{display:flex;gap:5px}
.btn-row button{ flex:1; border:none; padding:8px; background:#2209c2; color:#fff; border-radius:5px; cursor: pointer; }

/* NAV */
.bottom-nav{ position: fixed; bottom: 0; width: 100%; display: flex; justify-content: space-around; padding: 12px 0; background: #fff; z-index: 100;}
.bottom-nav div { flex: 1; text-align: center; padding: 10px 0; margin: 5px; border-radius: 10px; cursor: pointer; border: 2px solid transparent;}
.bottom-nav div:nth-child(1) { border-color: #2209c2; }
.bottom-nav div:nth-child(2) { border-color: #e91e63; }
.bottom-nav div:nth-child(3) { border-color: #009688; }

/* PAGES */
#loginPage, #accountPage{display:none;padding:80px 20px;text-align:center;background:#0d0dde;color:#fff; min-height: 100vh;}
#loginPage input{width:80%;padding:12px;margin:10px 0;border-radius:8px;border:none}
#loginPage button{width:85%;padding:12px;background:#2209c2;color:#fff;border:none;border-radius:8px}

#imgViewer{ position:fixed;inset:0;background:#000;display:none;z-index:200; }
</style>
</head>
<body>

<header>
<img src="https://i.ibb.co/k6Hy4TTP/1770736037665.png">
<div class="brand-name">DEALKART🛒</div>
<div id="userTop" onclick="openAccount()">Login</div>
</header>

<div id="loginPage">

<div class="main" id="mainSection">
    <div class="search-wrapper">
        <input class="search-input" id="searchInp" placeholder="Search products..." onkeyup="runSearch()">
    </div>

    <div class="v-container">
        <div class="v-header">💖 VALENTINE'S SPECIAL DEALS 💖</div>
        <div class="v-scroll">
            <div class="v-item" onclick="window.open('#')">
                <img src="https://i.ibb.co/k2gWNR0c/Screenshot-2026-02-10-17-53-11-326-com-flipkart-android-edit.jpg"><p>brasslate <br>₹180</p>
            </div>
            <div class="v-item" onclick="window.open('#')">
                <img src="https://i.ibb.co/WvX18kvq/Screenshot-2026-02-10-18-31-50-761-com-flipkart-android-edit.jpg"><p>pendant <br>₹169</p>
            </div>
            <div class="v-item" onclick="window.open('#')">
                <img src="https://i.ibb.co/ZppM1Mxf/Screenshot-2026-02-10-18-51-22-784-com-flipkart-android-edit.jpg"><p>Pink Dress <br>₹250</p>
            </div>
            <div class="v-item" onclick="window.open('#')">
                <img src="https://i.ibb.co/0R0pxBb2/Screenshot-2026-02-10-19-16-33-346-com-flipkart-android-edit.jpg"><p>Straightfit jeans <br>₹379</p>
            </div>
        </div>
    </div>

    <div class="cat-scroll" id="cat_panel"></div>
    <div class="sub-scroll" id="sub_panel"></div>
    <div id="grid_panel"></div>
</div>

<div id="accountPage">
<h3 id="accName"></h3>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px">
<button onclick="donate()">🎁 Donation</button>
<button onclick="showWishlist()">🛒 Wishlist</button>
<button onclick="openInsta()">📷 Instagram</button>
<button onclick="openTelegram()">➣ Telegram</button>
<button onclick="openHelp()">🎧 Help Center</button>
</div>
<br>
<button onclick="logout()" style="width:100%;padding:12px;background:#f00;color:#fff;border:none;border-radius:10px">Logout</button>
</div>

<div id="imgViewer">
  <div id="closeViewer" onclick="closeViewer()" style="position:absolute;top:10px;right:15px;color:#fff;font-size:22px;z-index:101;cursor:pointer;">✖</div>
  <div class="slider" id="viewerSlider" style="height:100vh;"></div>
</div>

<div class="bottom-nav">
<div onclick="resetHome()">🏠 Home</div>
<div onclick="showWishlist()">🛒 Wishlist</div>
<div onclick="openAccount()">👤 Account</div>
</div>

<script>
/* DATABASE - ADDED VALENTINE CATEGORY */

const DB_ITEMS=[

imgs:["https://i.ibb.co/k2gWNR0c/Screenshot-2026-02-10-17-53-11-326-com-flipkart-android-edit.jpg",

{ id:2,name:"MEN Full sleeve sweatshirt",cat:"Fashion",sub:"Men",price:299,cut:1499,link:"https://fktr.in/trid8uL",
imgs:["https://i.ibb.co/zH2qJBLK/Screenshot-2026-01-28-23-27-52-532-com-flipkart-android-edit.jpg","https://i.ibb.co/Y9dMqkg/Screenshot-2026-01-28-23-28-05-482-com-flipkart-android-edit.jpg"]},

imgs:["https://i.ibb.co/DD7xqdDg/Screenshot-2026-01-30-01-40-41-023-com-flipkart-android-edit.jpg","https://i.ibb.co/gb0HtCVp/Screenshot-2026-01-30-01-41-11-619-com-flipkart-android-edit.jpg"]},

{ id:8,name:"UV protection sunglasses",cat:"Sunglasses",price:169,cut:1640,link:"https://fktr.in/WuDnz8I",
imgs:["https://i.ibb.co/HL7Bk6Hn/Screenshot-2026-01-31-21-13-30-324-com-flipkart-android-edit.jpg"]},
{ id:9,name:"Men straight fit jeans",cat:"Fashion",sub:"Men",price:424,cut:2499,link:"https://fktr.in/ikPn8Sb",
imgs:["https://i.ibb.co/kgjDGfz9/Screenshot-2026-02-10-16-37-50-453-com-flipkart-android-edit.jpg"]},
{ id:10,name:"Sharara kurti set",cat:"Fashion",sub:"Women",price:464,cut:3999,link:"https://fktr.in/LTCH5Lm",
imgs:["https://i.ibb.co/6JHDKJRm/Screenshot-2026-02-10-19-31-18-540-com-flipkart-android-edit.jpg","https://i.ibb.co/TqKDf49q/Screenshot-2026-02-10-19-31-29-139-com-flipkart-android-edit.jpg"]}
];

let activeCat="For You", activeSub="", searchTerm="";
let wishlist=JSON.parse(localStorage.getItem("wishlist")||"[]");

/* RENDER FUNCTIONS */
function drawCategories(){
    cat_panel.innerHTML="";
    DB_CATS.forEach(c=>{cat_panel.innerHTML+=`<div class="cat-item" onclick="changeCat('${c.name}')">${c.name}</div>`;});
}
function drawSubcats(){
    sub_panel.innerHTML="";
    let f=DB_CATS.find(x=>x.name===activeCat);
    if(f&&f.sub){f.sub.forEach(s=>{sub_panel.innerHTML+=`<div class="sub-btn" onclick="changeSub('${s}')">${s}</div>`;});}
}

function drawProducts(list=DB_ITEMS){
    grid_panel.innerHTML="";
    list.filter(p=>{
        if(activeCat==="For You" && p.cat=== "Valentines Deals") return false; // Hide valentines deals from For You
        return (activeCat==="For You"||p.cat===activeCat) && (activeSub===""||p.sub===activeSub) && p.name.toLowerCase().includes(searchTerm);
    }).forEach(p=>{
        grid_panel.innerHTML+=`
        <div class="prod-card">
            <div class="prod-img-box">
                <div class="slider" id="slider_${p.id}">
                    ${p.imgs.map(img=>`<img src="${img}" onclick='openViewer(${JSON.stringify(p.imgs)})'>`).join("")}
                </div>
                <div class="arrow left" onclick="slideImg(${p.id},-1)">‹</div>
                <div class="arrow right" onclick="slideImg(${p.id},1)">›</div>
            </div>
            <div class="info-box">
                <b>${p.name}</b><br>
                <span class="price">₹${p.price}</span> <span class="cut">₹${p.cut}</span>
                <div class="btn-row">
                    <button onclick="addWishlist(${p.id})">🛒</button>
                    <button onclick="window.open('${p.link}')">BUY</button>
                </div>
            </div>
        </div>`;
    });
}

/* FIXING SLIDER ARROWS */
function slideImg(id,dir){
    let s=document.getElementById("slider_"+id);
    s.scrollBy({left:dir*s.clientWidth,behavior:"smooth"});
}

/* NAVIGATION & SEARCH */
function changeCat(c){activeCat=c;activeSub="";drawSubcats();drawProducts();}
function changeSub(s){activeSub=s;drawProducts();}
function runSearch(){searchTerm=searchInp.value.toLowerCase();drawProducts();}
function resetHome(){
    document.getElementById("accountPage").style.display="none";
    document.getElementById("loginPage").style.display="none";
    document.getElementById("mainSection").style.display="block";
    activeCat="For You"; drawProducts();
}

/* WISHLIST */
function addWishlist(id){if(!wishlist.includes(id)){wishlist.push(id);localStorage.setItem("wishlist",JSON.stringify(wishlist));alert("Saved to wishlist");}}
function showWishlist(){drawProducts(DB_ITEMS.filter(p=>wishlist.includes(p.id)));}

/* ACCOUNT & LOGIN FIX */
function openAccount(){
    let u = localStorage.getItem("customer_name");
    document.getElementById("mainSection").style.display="none";
    document.getElementById("loginPage").style.display="none";
    document.getElementById("accountPage").style.display="none";
    if(u){
        document.getElementById("accountPage").style.display="block";
        document.getElementById("accName").innerText="Hello, "+u;
    } else {
        document.getElementById("loginPage").style.display="block";
    }
}
function doLogin(){
    let name = document.getElementById("custName").value.trim();
    if(name===""){alert("Enter name");return;}
    localStorage.setItem("customer_name",name);
    document.getElementById("userTop").innerText=name;
    openAccount();
}
function logout(){localStorage.removeItem("customer_name");location.reload();}

/* VIEWER */
function openViewer(imgs){
    viewerSlider.innerHTML=imgs.map(i=>`<img src="${i}" style="width:100%;height:100vh;object-fit:contain;">`).join("");
    document.getElementById("imgViewer").style.display="block";
}
function closeViewer(){document.getElementById("imgViewer").style.display="none";}

/* OTHER ACTIONS */
function donate(){window.location.href="upi://pay?pa=9343988416@jio&pn=Smartbuy Foundation";}
function openInsta(){window.open("https://instagram.com/smart_buy.ind");}
function openTelegram(){window.open("https://t.me/smartbuyind");}
function openHelp(){window.location.href="mailto:shaileshkumarchauhan9340@gmail.com";}

window.onload=()=>{
    let u=localStorage.getItem("customer_name");
    if(u) document.getElementById("userTop").innerText=u;
    drawCategories();drawSubcats();drawProducts();
}
</script>
</body>
</html>
